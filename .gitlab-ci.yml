variables:
  IMAGE_NAME: "madmax04/devops-ak"
  IMAGE_TAG: "py-app-v1"

stages:
  - test
  - build
  - deploy

tests:
  stage: test
  image: python:3.9-slim
  before_script:
    - apt-get update -y && apt-get install make -y
  script:
    - make test

build:
  stage: build
  image: docker:20.10.6
  services:
    - docker:20.10.6-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASS
  script:
    - docker build -t $IMAGE_NAME:$IMAGE_TAG -f build/Dockerfile .
    - docker push $IMAGE_NAME:$IMAGE_TAG
  after_script:
    - docker logout

deploy:
  stage: deploy
  before_script:
    - chmod 400 $SSH_KEY
  script:
    - ssh -o StrictHostKeyChecking=no -i $SSH_KEY ubuntu@$SERVER_IP "
      docker login -u $REGISTRY_USER -p $REGISTRY_PASS &&
      docker ps -aq | xargs docker stop | xargs docker rm &&
      docker run -d -p 5000:5000 $IMAGE_NAME:$IMAGE_TAG"